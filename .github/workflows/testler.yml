# Her gönderimde (push) ve elle başlatıldığında tüm testleri GitHub'ın sunucusunda çalıştırır.
# Bilgisayarınızın açık olması gerekmez. Buradaki veritabanı şifresi yalnız bu geçici test sunucusuna aittir.
name: Testler

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # her gün: yedek + geri yükleme testi dahil tüm testler

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16 # çalıştırıcıdaki pg_dump/pg_restore 16 ile aynı ana sürüm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-sifre
          POSTGRES_DB: oner_yapi_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-sifre@localhost:5432/oner_yapi_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:ci-sifre@localhost:5432/oner_yapi_test?schema=public
      SEED_ADMIN_EMAIL: admin@oneryapi.local
      SEED_ADMIN_PASSWORD: ci-yonetici-sifresi-12
      UPLOAD_DIR: storage/uploads
      NEXT_TELEMETRY_DISABLED: "1"
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test veritabanını oluştur
        run: PGPASSWORD=ci-sifre psql -h localhost -U postgres -c "CREATE DATABASE oner_yapi_test"
      - name: Paketleri kur
        run: npm install --no-audit --no-fund
      - name: Prisma istemcisini üret
        run: npx prisma generate
      - name: Tip kontrolü
        run: npm run typecheck
      - name: Birim testleri
        run: npm run test:unit
      - name: Migration + seed (boş veritabanına)
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Migration ile şema birebir aynı mı (elle yazılan SQL kontrolü)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Entegrasyon testleri (gerçek veritabanında stok / depo)
        run: INTEGRATION_DATABASE_URL="$DATABASE_URL" npm run test:integration
      - name: Yedek al ve yeni veritabanına geri yükleyip doğrula (süre ölçülür)
        env:
          UPLOAD_DIR: storage/ci-yukleme
          YEDEK_DIR: ci-yedekler
        run: |
          pg_dump --version
          mkdir -p storage/ci-yukleme/products/2026-11
          head -c 2048 /dev/urandom > storage/ci-yukleme/products/2026-11/ornek.png
          echo "deneme" > storage/ci-yukleme/products/2026-11/ikinci.webp
          node scripts/yedek.mjs
          D=$(ls -d ci-yedekler/20* | tail -1)
          node scripts/geri-yukle.mjs "$D" oner_yapi_geri_ci /tmp/geri-gorsel
          # aynı ada ikinci kez geri yükleme reddedilmeli (üzerine yazmaz)
          if node scripts/geri-yukle.mjs "$D" oner_yapi_geri_ci /tmp/geri-gorsel2; then echo "UZERINE YAZDI" && exit 1; fi
          cat ci-yedekler/son-durum.json | head -5
      - name: Kategori eki (iki kez çalışır; ikincide hiçbir şey eklememeli)
        run: |
          npx tsx prisma/kategori-ek.ts --uygula
          npx tsx prisma/kategori-ek.ts | tee ikinci.txt
          grep -q "0 kategori, 0 marka" ikinci.txt
      - name: Tarayıcı (Playwright) testleri
        run: npx playwright test --reporter=list,html
      - name: Test raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-raporu
          path: |
            playwright-report
            test-results
          retention-days: 14
