# Her gönderimde (push) ve elle başlatıldığında tüm testleri GitHub'ın sunucusunda çalıştırır.
# Bilgisayarınızın açık olması gerekmez. Buradaki veritabanı şifresi yalnız bu geçici test sunucusuna aittir.
name: Testler

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # her gün: yedek + geri yükleme testi dahil tüm testler

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18 # çalıştırıcıdaki pg_dump/pg_restore 18 ve yerel kurulumla (18.6) aynı ana sürüm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-sifre
          POSTGRES_DB: oner_yapi_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-sifre@localhost:5432/oner_yapi_ci?schema=public
      TEST_DATABASE_URL: postgresql://postgres:ci-sifre@localhost:5432/oner_yapi_test?schema=public
      SEED_ADMIN_EMAIL: admin@oneryapi.local
      SEED_ADMIN_PASSWORD: ci-yonetici-sifresi-12
      UPLOAD_DIR: storage/uploads
      NEXT_TELEMETRY_DISABLED: "1"
      PW_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test veritabanını oluştur
        run: PGPASSWORD=ci-sifre psql -h localhost -U postgres -c "CREATE DATABASE oner_yapi_test"
      - name: Paketleri kur
        run: npm install --no-audit --no-fund
      - name: Prisma istemcisini üret
        run: npx prisma generate
      - name: Tip kontrolü
        run: npm run typecheck
      - name: Birim testleri
        run: npm run test:unit
      - name: Migration + seed (boş veritabanına)
        run: npx prisma migrate deploy && npx prisma db seed
      - name: Migration ile şema birebir aynı mı (elle yazılan SQL kontrolü)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Entegrasyon testleri (gerçek veritabanında stok / depo)
        run: INTEGRATION_DATABASE_URL="$DATABASE_URL" npm run test:integration
      - name: Yedek al ve yeni veritabanına geri yükleyip doğrula (süre ölçülür)
        env:
          UPLOAD_DIR: storage/ci-yukleme
          YEDEK_DIR: ci-yedekler
        run: |
          pg_dump --version
          mkdir -p storage/ci-yukleme/products/2026-11
          head -c 2048 /dev/urandom > storage/ci-yukleme/products/2026-11/ornek.png
          echo "deneme" > storage/ci-yukleme/products/2026-11/ikinci.webp
          node scripts/yedek.mjs
          D=$(ls -d ci-yedekler/20* | tail -1)
          node scripts/geri-yukle.mjs "$D" oner_yapi_geri_ci /tmp/geri-gorsel
          # aynı ada ikinci kez geri yükleme reddedilmeli (üzerine yazmaz)
          if node scripts/geri-yukle.mjs "$D" oner_yapi_geri_ci /tmp/geri-gorsel2; then echo "UZERINE YAZDI" && exit 1; fi
          cat ci-yedekler/son-durum.json | head -5
      - name: Kategori eki (iki kez çalışır; ikincide hiçbir şey eklememeli)
        run: |
          npx tsx prisma/kategori-ek.ts --uygula
          npx tsx prisma/kategori-ek.ts | tee ikinci.txt
          grep -q "0 kategori, 0 marka" ikinci.txt
      - name: Tarayıcı (Playwright) testleri
        run: npx playwright test --reporter=list,html
      - name: Test raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-raporu
          path: |
            playwright-report
            test-results
          retention-days: 14

  performans:
    # Yük testi: üretim derlemesi (next build + next start), 10.000 ve 50.000 ürünle, 100 ve 500 eşzamanlı istemci.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-sifre
          POSTGRES_DB: oner_yapi_yuk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-sifre@localhost:5432/oner_yapi_yuk_test?schema=public
      SEED_ADMIN_EMAIL: admin@oneryapi.local
      SEED_ADMIN_PASSWORD: ci-yonetici-sifresi-12
      NEXT_TELEMETRY_DISABLED: "1"
      PGPASSWORD: ci-sifre
      RATE_LIMIT_ARAMA: "100000000"
      RATE_LIMIT_ADRES: "100000000"
      RATE_LIMIT_POST: "100000000"
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate && npx prisma migrate deploy && npx prisma db seed
      - name: Üretim derlemesi (süre ölçülür)
        run: |
          S=$(date +%s); npm run build:test; E=$(date +%s)
          echo "Derleme süresi: $((E-S)) sn" | tee -a $GITHUB_STEP_SUMMARY
      - name: 10.000 ürün
        run: psql -h localhost -U postgres -d oner_yapi_yuk_test -v adet=10000 -v tur=a -f scripts/yuk-verisi.sql
      - name: Sunucuyu başlat
        run: |
          (npx next start -p 3200 > sunucu.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://localhost:3200/ > /dev/null && break; sleep 2; done
      - name: Yük testi — 10.000 ürün
        run: |
          CAT=$(psql -h localhost -U postgres -d oner_yapi_yuk_test -tAc "SELECT slug FROM categories WHERE \"parentId\" IS NOT NULL ORDER BY \"sortOrder\" LIMIT 1")
          echo "## Yük testi (10.000 ürün)" >> $GITHUB_STEP_SUMMARY
          for C in 100 500; do
            node scripts/yuk-testi.mjs http://localhost:3200 $C 20 / /urunler "/kategori/$CAT" /urun/yuk-a-17 "/arama?q=matkap" "/api/adres?il=34" | tee -a yuk.jsonl
          done
          node -e 'for (const l of require("fs").readFileSync("yuk.jsonl","utf8").trim().split("\n")) { const r = JSON.parse(l); console.log(`- ${r.concurrency} eşzamanlı: ${r.requests} istek, ${r.rps} istek/sn, p50 ${r.p50} ms, p95 ${r.p95} ms, p99 ${r.p99} ms, hata %${r.errorRate} ${JSON.stringify(r.codes)}`) }' >> $GITHUB_STEP_SUMMARY
      - name: Yük testi — 50.000 ürün (liste ve arama)
        run: |
          psql -h localhost -U postgres -d oner_yapi_yuk_test -v adet=40000 -v tur=b -f scripts/yuk-verisi.sql
          echo "## Yük testi (50.000 ürün)" >> $GITHUB_STEP_SUMMARY
          for C in 100; do
            node scripts/yuk-testi.mjs http://localhost:3200 $C 20 /urunler "/arama?q=matkap" /urun/yuk-b-99 | tee yuk50.jsonl
          done
          node -e 'const r = JSON.parse(require("fs").readFileSync("yuk50.jsonl","utf8")); console.log(`- ${r.concurrency} eşzamanlı: ${r.requests} istek, ${r.rps} istek/sn, p50 ${r.p50} ms, p95 ${r.p95} ms, p99 ${r.p99} ms, hata %${r.errorRate} ${JSON.stringify(r.codes)}`)' >> $GITHUB_STEP_SUMMARY
          for u in / /urunler "/arama?q=matkap" /urun/yuk-b-99; do curl -s -o /dev/null -w "$u tek istek: %{time_total} sn\n" "http://localhost:3200$u"; done | tee -a $GITHUB_STEP_SUMMARY
      - name: Sunucu kaydı
        if: always()
        run: tail -50 sunucu.log

  tarayicilar:
    # Tarayıcı uyumluluğu: Firefox, WebKit (Safari motoru, masaüstü + iPhone) ve Microsoft Edge.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-sifre
          POSTGRES_DB: oner_yapi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-sifre@localhost:5432/oner_yapi_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:ci-sifre@localhost:5432/oner_yapi_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      CROSS_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: Firefox ve WebKit tarayıcılarını kur
        run: npx playwright install --with-deps firefox webkit
      - name: Edge var mı
        run: (which microsoft-edge || which microsoft-edge-stable) && microsoft-edge --version || npx playwright install msedge
      - run: npx playwright test --reporter=list
